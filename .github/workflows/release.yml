name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run audit
      - name: Compile Windows audio bridge
        if: runner.os == 'Windows'
        run: |
          python -m pip install -r native/windows/requirements.txt
          python -m PyInstaller --noconfirm --clean --onefile --console --name voice-console --distpath .cache --workpath .cache/pyinstaller --specpath .cache --collect-all _sounddevice_data native/windows/audio_bridge.py
      - run: npm run check
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: LingXu-${{ matrix.os }}
          path: dist/*.zip
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: LingXu-*
          path: assets
          merge-multiple: true
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd assets
          sha256sum *.zip > SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --title "聆序 ListenFlow $GITHUB_REF_NAME" --notes-file ../docs/release-notes.md
